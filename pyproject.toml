[project]
name = "microduck"
version = "0.1.0"
description = "Simulation-only teaching lab for the Pollen Robotics Microduck biped (MuJoCo + Gymnasium, CPU-friendly)"
requires-python = ">=3.12"
dependencies = [
    "gymnasium>=1.3.0",
    "imageio>=2.37.4",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "mujoco>=3.12.0",
    "numpy>=2.5.2",
    "onnx>=1.22.0",
    "onnxruntime>=1.29.0",
    "pandas>=3.0.5",
    "stable-baselines3>=2.9.0",
]

[dependency-groups]
dev = [
    "jupytext>=1.19.5",
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/microduck_sim"]

[tool.pytest.ini_options]
markers = ["notebooks: executes all lecture/solution notebooks headless (slow, opt-in)"]
addopts = "-m 'not notebooks'"
